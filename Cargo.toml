[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-policy-administrator"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Signed authorization verification and durable one-use enforcement ledger for Crowsi"
license = "Apache-2.0"
readme = "README.md"
publish = ["ecosystem-private"]
autotests = false
repository = "https://github.com/crowsi-net/crowsi-policy-administrator"

[package.metadata.crowsi]
external-actions = false
provider-enforcer = "not-shipped"

[workspace]
members = ["."]
resolver = "3"

[dependencies]
base64 = "0.22.1"
crowsi-control-contracts = { version = "=0.1.0", registry = "ecosystem-private" }
crowsi-policy-engine = { version = "=0.1.0", registry = "ecosystem-private" }
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
time = { version = "0.3.54", features = ["macros", "parsing"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[test]]
name = "authorization"
path = "tests/harnesses/authorization.rs"

[[test]]
name = "protocol_v2"
path = "tests/harnesses/protocol_v2.rs"
